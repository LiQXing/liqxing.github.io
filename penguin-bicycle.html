<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒立也要向前 · 企鹅单车俱乐部</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf4f3;color:#183e48;font-family:"Microsoft YaHei",system-ui,sans-serif}
  body{min-height:100svh;display:flex;flex-direction:column;padding:30px 5vw 22px}
  header{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px;letter-spacing:2px}
  .brand{font-weight:800;display:flex;align-items:center;gap:12px}.mark{width:30px;height:30px;border:2px solid #254b55;border-radius:50%;display:grid;place-items:center;font-size:17px}
  .tag{font-size:10px;border:1px solid #b7c9c9;border-radius:30px;padding:8px 13px;letter-spacing:1.5px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1500px;width:100%;margin:0 auto}
  .heading{padding:40px 0 0;text-align:center;position:relative;z-index:1;pointer-events:none}
  .eyebrow{font-size:10px;letter-spacing:5px;color:#62858b;margin-bottom:14px}
  h1{margin:0;font-size:clamp(30px,4.4vw,64px);letter-spacing:-2px;font-weight:850}h1 span{color:#e87752}
  .subtitle{font-size:13px;letter-spacing:2px;color:#708e92;margin:16px 0 0}
  .scene{width:100%;height:clamp(330px,52vh,650px);position:relative}
  canvas{display:block;width:100%;height:100%}
  .caption{position:absolute;left:3%;bottom:24px;font-size:10px;letter-spacing:2px;color:#78969b;line-height:1.8}
  .controls{display:flex;align-items:center;justify-content:center;gap:25px;flex-wrap:wrap;padding:14px 0 30px}
  button{font:inherit;cursor:pointer;border:0;background:#214a54;color:white;border-radius:30px;padding:13px 22px;font-size:12px;letter-spacing:1px;min-width:114px;transition:background .2s,transform .2s}button:hover{background:#35636d;transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #e87752;outline-offset:5px}
  label{display:flex;align-items:center;gap:12px;font-size:11px;color:#5c7d84;letter-spacing:1px}input{accent-color:#e87752;width:110px;cursor:pointer}output{font-variant-numeric:tabular-nums;min-width:32px;color:#254b55}
  footer{display:flex;justify-content:space-between;gap:20px;padding-top:17px;border-top:1px solid #d1dede;font-size:10px;letter-spacing:1.5px;color:#799398}
  @media(max-width:600px){body{padding:22px 20px}.heading{padding-top:40px}.tag{font-size:8px;padding:7px 9px}.brand{font-size:10px;letter-spacing:1px}.subtitle{font-size:11px;letter-spacing:1px}.scene{height:390px}.caption{bottom:10px;font-size:8px}.controls{gap:18px}footer{font-size:8px;letter-spacing:.7px}h1{letter-spacing:-1px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">↟</span>企鹅单车俱乐部</div><div class="tag">POLAR CYCLING CLUB / 001</div></header>
<main>
  <div class="heading"><div class="eyebrow">A DIFFERENT WAY TO RIDE</div><h1>倒立，也要<span>向前。</span></h1><p class="subtitle">南极的风很轻，今天的姿势有点特别。</p></div>
  <div class="scene"><canvas id="scene" role="img" aria-label="一只戴橘色围巾的企鹅，头朝下、脚朝天，用双鳍踩着单车踏板，在冰原上倒立骑行。"></canvas><div class="caption">南极漫游日记<br>01 — 换个角度看世界</div></div>
  <div class="controls"><button id="pause" type="button" aria-pressed="false">Ⅱ 暂停一下</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speedValue" for="speed">1×</output></label></div>
</main>
<footer><span>保持好奇，保持平衡。</span><span>一只企鹅 · 两个轮子 · 无限快乐</span></footer>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
  const pause=document.getElementById('pause'),speed=document.getElementById('speed');
  let width=1000,height=520,time=0,last=0,running=true,velocity=1;
  const TAU=Math.PI*2,ink='#214653',orange='#ed8056';
  function resize(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
  new ResizeObserver(resize).observe(canvas);
  pause.addEventListener('click',()=>{running=!running;pause.textContent=running?'Ⅱ 暂停一下':'▶ 继续出发';pause.setAttribute('aria-pressed',String(!running));});
  speed.addEventListener('input',()=>{velocity=Number(speed.value);document.getElementById('speedValue').value=velocity+'×';});
  function path(points,color,lineWidth=3,close=false,fill=null){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);if(close)ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(color){ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}}
  function ellipse(x,y,rx,ry,color,rotation=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rotation,0,TAU);ctx.fillStyle=color;ctx.fill();}
  function curve(a,b,c,d,color,lineWidth){ctx.beginPath();ctx.moveTo(...a);ctx.bezierCurveTo(...b,...c,...d);ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.stroke();}
  function mountain(x,y,w,h,color){path([[x-w/2,y],[x-w*.12,y-h*.82],[x+w*.02,y-h],[x+w*.24,y-h*.52],[x+w/2,y]],null,0,true,color);path([[x-w*.12,y-h*.82],[x+w*.02,y-h],[x+w*.24,y-h*.52],[x+w*.09,y-h*.59],[x-w*.02,y-h*.7],[x-w*.12,y-h*.66]],null,0,true,'#f8fbf9');}
  function wheel(x,y,angle){
    ellipse(x,y,57,57,ink);ellipse(x,y,49,49,'#f4f8f5');
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    for(let i=0;i<12;i++){const a=i*TAU/12;path([[0,0],[Math.cos(a)*47,Math.sin(a)*47]],'#b0c9cc',1.6);}
    ctx.beginPath();ctx.arc(0,0,53,-.5,.45);ctx.strokeStyle='#65848c';ctx.lineWidth=2;ctx.stroke();
    ellipse(0,-43,3,6,orange);ctx.restore();ellipse(x,y,7,7,ink);ellipse(x,y,3,3,'#d1e5e3');
  }
  function penguin(t,phase){
    const pedal1=[10+22*Math.cos(phase),314+22*Math.sin(phase)];
    const pedal2=[10-22*Math.cos(phase),314-22*Math.sin(phase)];
    // The flippers reach the pedals while the body stays upside down.
    curve([-8,202],[-75,240],[-52,pedal2[1]-10],pedal2,'#173744',15);
    path([[pedal2[0]-12,pedal2[1]],[pedal2[0]+12,pedal2[1]]],ink,6);
    ctx.save();ctx.translate(7,177);ctx.rotate(Math.sin(t*2.4)*.045);
    // Feet point skyward. An inverted teardrop makes the pose unambiguous.
    path([[-22,-48],[-33,-72],[-54,-76],[-52,-85],[-29,-84],[-11,-58]],ink,2,true,orange);
    path([[19,-49],[35,-75],[56,-78],[59,-88],[33,-87],[7,-57]],ink,2,true,orange);
    ctx.beginPath();ctx.moveTo(-13,-61);ctx.bezierCurveTo(-49,-48,-54,6,-36,33);ctx.bezierCurveTo(-28,58,29,65,43,35);ctx.bezierCurveTo(61,1,35,-56,14,-62);ctx.closePath();ctx.fillStyle=ink;ctx.fill();
    ellipse(3,-4,31,49,'#fffaf0',-.12);
    // A little belly sheen.
    ellipse(-7,-21,12,22,'#ffffff',.15);
    // Orange scarf trails behind the rider.
    ctx.beginPath();ctx.moveTo(-20,37);ctx.bezierCurveTo(-53,28,-65,56+Math.sin(t*7)*7,-104,35+Math.sin(t*6)*8);ctx.lineTo(-91,55+Math.sin(t*6)*8);ctx.bezierCurveTo(-56,71+Math.sin(t*7)*7,-41,42,-17,49);ctx.closePath();ctx.fillStyle=orange;ctx.fill();
    curve([-23,42],[-5,51],[21,49],[33,40],orange,12);
    // Head sits BELOW the belly; beak points toward the ground.
    ellipse(5,67,35,33,ink,.12);
    ellipse(-7,74,15,20,'#fffaf0',-.28);ellipse(18,75,16,20,'#fffaf0',.28);
    ellipse(-7,75,3.4,4.4,ink);ellipse(19,76,3.4,4.4,ink);
    ellipse(-8,74,1,1.3,'white');ellipse(18,75,1,1.3,'white');
    path([[0,87],[13,87],[7,99]],null,0,true,orange);
    ellipse(-20,81,5,3,'#efb2a0');ellipse(31,81,5,3,'#efb2a0');
    ctx.restore();
    curve([38,198],[83,233],[65,pedal1[1]-21],pedal1,ink,16);
    curve([39,204],[68,236],[57,pedal1[1]-24],[pedal1[0],pedal1[1]-6],'#365c67',4);
    path([[pedal1[0]-12,pedal1[1]],[pedal1[0]+12,pedal1[1]]],ink,6);
  }
  function draw(){
    ctx.clearRect(0,0,width,height);
    const scale=Math.min(width/880,height/440),cx=width*.51,ground=height*.83;
    // Quiet polar landscape, with layers scrolling at different speeds.
    ellipse(width*.78,height*.22,31,31,'#f3d5ad');
    const horizon=ground-55*scale;
    for(let i=-1;i<5;i++){const period=width+360;let x=((i*310-time*7)%period+period)%period-180;mountain(x,horizon,330*scale,95*scale,'#dce9e8');}
    ctx.beginPath();ctx.moveTo(0,horizon+20);ctx.bezierCurveTo(width*.3,horizon-5,width*.65,horizon+44,width,horizon+3);ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.closePath();ctx.fillStyle='#e6efed';ctx.fill();
    ctx.beginPath();ctx.moveTo(0,ground+4);ctx.bezierCurveTo(width*.35,ground-6,width*.6,ground+14,width,ground);ctx.strokeStyle='#c6dcdb';ctx.lineWidth=1.5;ctx.stroke();
    for(let i=0;i<24;i++){let x=((i*97-time*95)%(width+80)+(width+80))%(width+80)-40;let y=ground+14+(i%4)*12*scale;path([[x,y],[x+(i%3+1)*9*scale,y]],i%3===0?'#bcd6d5':'#d1e2df',1.7);}
    for(let i=0;i<16;i++){const x=((i*139-time*(12+i%4*7))%(width+20)+(width+20))%(width+20);const y=height*.15+(i*43)%(height*.53);ellipse(x,y,1.5,1.5,'#fff');}
    ctx.save();ctx.translate(cx,ground);ctx.scale(scale,scale);ctx.translate(0,-390);
    ellipse(0,393,184,12,'#d1e2df');ellipse(0,392,116,6,'#bfd5d4');
    ctx.translate(0,Math.sin(time*7)*1.2);
    const phase=time*4,rotation=time*1.55;
    wheel(-111,332,rotation);wheel(120,332,rotation);
    // Sea-green diamond frame.
    path([[-111,332],[-54,254],[10,314],[-111,332]],'#519d99',7,true);
    path([[-54,254],[83,248],[10,314]],'#519d99',7);
    path([[83,248],[120,332]],ink,6);
    path([[-54,254],[-60,234]],ink,5);
    curve([-83,231],[-62,226],[-49,227],[-38,230],ink,9);
    path([[83,248],[77,222],[94,214],[112,214]],ink,5);
    curve([108,214],[131,209],[131,230],[117,234],ink,5);
    ellipse(10,314,16,16,ink);ellipse(10,314,10,10,'#aaccc7');
    curve([-109,325],[-65,316],[-31,299],[10,300],'#8caaa9',2);
    curve([-109,340],[-61,345],[-28,334],[10,328],'#8caaa9',2);
    path([[10-22*Math.cos(phase),314-22*Math.sin(phase)],[10+22*Math.cos(phase),314+22*Math.sin(phase)]],ink,5);
    ellipse(10,314,4,4,'#f5e8c9');
    penguin(time,phase);
    // Small movement marks and ice dust.
    for(let i=0;i<3;i++){const x=-175-((time*37+i*19)%64);const y=276+i*17;ctx.globalAlpha=.2+.3*(1-((time*37+i*19)%64)/64);path([[x,y],[x+19,y]],'#7da6aa',2);}
    ctx.globalAlpha=1;
    for(let i=0;i<5;i++){const p=(time*1.2+i/5)%1;ellipse(-139-p*72,383-Math.sin(p*Math.PI)*13,2.7*(1-p),2.7*(1-p),'#fff');}
    ctx.restore();
  }
  function frame(now){const delta=last?Math.min((now-last)/1000,.05):0;last=now;if(running)time+=delta*velocity;draw();requestAnimationFrame(frame);}
  resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
